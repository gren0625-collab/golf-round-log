<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#19613F">
<meta name="description" content="ゴルフのラウンド中に、打った場所と球のあった場所をGPSで記録する1枚のページ。">
<title>AIGolf 落下点ノート</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="落下点ノート">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
</head>
<body>
<style>
/* ─────────────────────────────────────────────────────────────
   AIGolf 落下点ノート
   日向で・片手で・歩きながら操作する道具。読み物ではない。
   色は飾りやのうて状態そのもの： ターフ緑=打った / 黄土=球のとこ
   日本語は端末の書体（電波が無い所で崩れんため）。数字だけ Barlow Condensed。
   ───────────────────────────────────────────────────────────── */
:root{
  --ground:#E8ECE3;  --surface:#F8FAF5;  --surface-2:#DCE3D5;
  --ink:#131B16;     --ink-mute:#586A5D; --line:#C4CEBD;
  --tee:#19613F;     --tee-ink:#FFFFFF;
  --ball:#A75E15;    --ball-ink:#FFFFFF;
  --ok:#2C8355;      --warn:#9C7112;     --bad:#A63C33;
  --shadow:0 1px 0 rgba(19,27,22,.10), 0 6px 18px rgba(19,27,22,.07);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1411;  --surface:#161F1A;  --surface-2:#1F2B24;
    --ink:#E6EDE5;     --ink-mute:#93A398; --line:#2B382F;
    --tee:#2E9463;     --tee-ink:#04150C;
    --ball:#DA8B2C;    --ball-ink:#201302;
    --ok:#48B87B;      --warn:#D6A63C;     --bad:#D96C5F;
    --shadow:0 1px 0 rgba(0,0,0,.5), 0 8px 22px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0D1411;  --surface:#161F1A;  --surface-2:#1F2B24;
  --ink:#E6EDE5;     --ink-mute:#93A398; --line:#2B382F;
  --tee:#2E9463;     --tee-ink:#04150C;
  --ball:#DA8B2C;    --ball-ink:#201302;
  --ok:#48B87B;      --warn:#D6A63C;     --bad:#D96C5F;
  --shadow:0 1px 0 rgba(0,0,0,.5), 0 8px 22px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",
              "Noto Sans JP",system-ui,-apple-system,sans-serif;
  font-size:17px; line-height:1.5;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
.num{font-family:"Barlow Condensed","Roboto Condensed",system-ui,sans-serif;
     font-variant-numeric:tabular-nums; font-weight:700; letter-spacing:.01em}

.app{
  min-height:100dvh; max-width:520px; margin:0 auto;
  display:grid; grid-template-rows:auto auto 1fr auto;
  gap:12px; padding:12px 14px calc(14px + env(safe-area-inset-bottom));
}

/* ── 上：測位の状態 ───────────────────────────────── */
.bar{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:10px 14px; box-shadow:var(--shadow);
}
.fix{display:flex; align-items:center; gap:9px; min-width:0}
.dot{width:11px; height:11px; border-radius:50%; background:var(--ink-mute); flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.fix-t{font-size:15px; color:var(--ink-mute); white-space:nowrap;
       overflow:hidden; text-overflow:ellipsis}
.fix-t b{color:var(--ink); font-weight:600}
.count{font-size:14px; color:var(--ink-mute); white-space:nowrap}
.count .num{font-size:21px; color:var(--ink); margin-right:2px}

/* ── ★グリーンまで（2026-09-15） ─────────────────────── */
.green{
  display:flex; align-items:baseline; gap:8px; justify-content:center;
  padding:6px 10px 2px; font-variant-numeric:tabular-nums;
}
.green .gy{font-size:34px; font-weight:700; letter-spacing:-.02em}
.green .gu{font-size:13px; color:var(--ink-mute); margin-left:-4px}
.green .gd{font-size:13px; color:var(--ink-mute); margin-left:6px}
.green .gp{font-size:13px; color:var(--ink-mute); margin-left:auto}
.green.stale .gy{opacity:.35}
.green-choice{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:10px 12px; box-shadow:var(--shadow); display:grid; gap:8px;
}
.green-choice[hidden]{display:none}
.green-choice p{margin:0; font-size:14px; color:var(--ink-mute); text-align:center}
.green-choice .choices{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px}
.green-choice button{
  min-height:42px; border:1px solid var(--line); border-radius:10px;
  background:var(--surface-2); color:var(--ink); font:inherit; cursor:pointer;
}
.green-choice button[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.special-hint{margin:0; padding:10px 12px; border-radius:10px; background:var(--surface-2); color:var(--ink-mute); font-size:14px; line-height:1.5}
.special-hint[hidden]{display:none}

/* ── ホールと番手 ─────────────────────────────────── */
/* ── ラウンドの頭で1回だけ（コース名・地面） ───────────── */
.round{display:grid; grid-template-columns:1fr auto; gap:8px; align-items:stretch}
.round input{
  min-width:0; height:44px; padding:0 12px;
  border:1px solid var(--line); border-radius:10px;
  background:var(--surface); color:var(--ink); font-size:16px; font-family:inherit;
}
.round input::placeholder{color:var(--ink-mute)}
.round input:not([value=""]):valid{border-color:var(--line)}
.ground{display:flex; gap:6px}
.ground button{
  flex:none; min-width:64px; height:44px; padding:0 10px;
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
  border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit;
}
.ground button[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
/* ★未記入は薄く光らせて気づかせる（うるさくはせん） */
.round.todo input, .round.todo .ground button{border-color:var(--warn,#c98a2e)}
@media (max-width:380px){
  .round{grid-template-columns:1fr}
  .ground button{flex:1; min-width:0}
}
.setup{display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:stretch}
.hole{
  display:flex; align-items:center; gap:2px;
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:4px; box-shadow:var(--shadow);
}
.hole button{
  width:42px; height:52px; border:0; background:transparent; color:var(--ink-mute);
  font-size:26px; line-height:1; border-radius:10px; cursor:pointer;
}
.hole button:active{background:var(--surface-2)}
.hole .val{text-align:center; padding:0 4px; min-width:62px}
.hole .val .num{display:block; font-size:30px; line-height:1}
.hole .val small{display:block; font-size:11px; color:var(--ink-mute); letter-spacing:.14em}

.clubs{
  display:flex; gap:6px; overflow-x:auto; align-items:center;
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:6px; box-shadow:var(--shadow);
  scrollbar-width:none;
}
.clubs::-webkit-scrollbar{display:none}
.clubs button{
  flex:none; min-width:52px; height:48px; padding:0 10px;
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
  border-radius:10px; font-size:17px; font-weight:600; cursor:pointer;
  font-family:"Barlow Condensed",system-ui,sans-serif; letter-spacing:.02em;
}
.clubs button[aria-pressed="true"]{
  background:var(--ink); color:var(--surface); border-color:var(--ink);
}

/* ── 主役のボタン ─────────────────────────────────── */
main{display:grid; gap:12px; min-height:0}
.stroke-counter{text-align:center; padding:2px 8px; font-variant-numeric:tabular-nums}
.stroke-counter .now{font-size:52px; font-weight:700; line-height:1; letter-spacing:-.03em}
.stroke-counter .breakdown{margin-top:7px; font-size:15px; color:var(--ink-mute)}
.hit{
  width:100%; height:100%; min-height:190px;
  border:0; border-radius:20px; cursor:pointer;
  display:grid; align-content:center; justify-items:center; gap:6px;
  padding:20px; text-align:center;
  transition:transform .08s ease, filter .12s ease;
  box-shadow:var(--shadow);
}
.hit:active{transform:scale(.985); filter:brightness(1.06)}
.hit:focus-visible{outline:4px solid var(--ink); outline-offset:3px}
.hit[data-state="tee"]{background:var(--tee); color:var(--tee-ink)}
.hit[data-state="ball"]{background:var(--ball); color:var(--ball-ink)}
.hit[data-state="geo"]{background:var(--surface); color:var(--ink);
                       border:2px dashed var(--line)}
.hit .lead{font-size:13px; letter-spacing:.2em; opacity:.78}
.hit .big{font-size:34px; font-weight:700; line-height:1.2; text-wrap:balance}
.hit .sub{font-size:14px; opacity:.8}

.row{display:grid; grid-template-columns:1fr auto auto; gap:8px}
/* ★球が見つからんかった時。打った場所だけ残して、距離は残さん。
   球の所で押す代わりに押す物やから、大きいボタンのすぐ下に置く */
.ob{width:100%; margin-bottom:10px; color:var(--bad); border-color:var(--bad)}
.ob[hidden]{display:none}
.ghost{
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:12px; min-height:52px; padding:0 16px; font-size:16px;
  cursor:pointer; box-shadow:var(--shadow);
}
.ghost:active{background:var(--surface-2)}
.ghost:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
.ghost[disabled]{opacity:.42; cursor:default}

/* ── 下：直前の一本 ───────────────────────────────── */
.last{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 14px; box-shadow:var(--shadow);
  display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center;
}
.last .yd{display:flex; align-items:baseline; gap:4px}
.last .yd .num{font-size:44px; line-height:.9}
.last .yd span{font-size:14px; color:var(--ink-mute)}
.last .meta{font-size:14px; color:var(--ink-mute); line-height:1.45; min-width:0}
.last .meta b{color:var(--ink); font-weight:600}
.last.empty{color:var(--ink-mute); display:block; text-align:center; font-size:15px}

/* ── 書き出しの覆い ───────────────────────────────── */
.sheet{
  position:fixed; inset:0; background:var(--ground);
  display:grid; grid-template-rows:auto 1fr auto; gap:12px;
  padding:14px calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom));
  max-width:520px; margin:0 auto; z-index:10;
}
.sheet[hidden]{display:none}
.sheet .who{display:grid; gap:6px}
.sheet h2{margin:0; font-size:20px}
.sheet label{font-size:13px; color:var(--ink-mute)}
.sheet input{
  width:100%; min-height:52px; padding:0 14px; font-size:18px;
  background:var(--surface); color:var(--ink);
  border:1px solid var(--line); border-radius:12px;
  font-family:inherit;
}
.sheet input:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
.sheet p{margin:0; font-size:14px; color:var(--ink-mute)}
.sheet textarea{
  width:100%; height:100%; resize:none;
  background:var(--surface); color:var(--ink);
  border:1px solid var(--line); border-radius:var(--r); padding:12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12px; line-height:1.55; white-space:pre; overflow:auto;
}
.sheet .foot{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.danger{color:var(--bad); border-color:var(--bad)}

.ask{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:12px 14px; box-shadow:var(--shadow); display:grid; gap:8px;
}
.ask[hidden]{display:none}
.ask label{font-size:14px; color:var(--ink-mute)}
.askrow{display:grid; grid-template-columns:1fr auto; gap:8px}
.ask input{
  min-height:52px; padding:0 14px; font-size:18px; font-family:inherit;
  background:var(--ground); color:var(--ink);
  border:1px solid var(--line); border-radius:12px;
}
.ask input:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
.note{font-size:12px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--ink-mute); text-align:center; line-height:1.55}
.note b{color:var(--bad)}
.actions{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px}
.summary,.penalty-edit{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:12px 14px; box-shadow:var(--shadow); font-size:15px;
}
.summary[hidden],.penalty-edit[hidden]{display:none}
.storage-alert{
  background:var(--surface); border:2px solid var(--bad); border-radius:var(--r);
  padding:10px 14px; color:var(--bad); font-size:14px; box-shadow:var(--shadow);
}
.storage-alert[hidden]{display:none}
.recovery-actions{
  background:var(--surface); border:2px solid var(--bad); border-top:0;
  border-radius:0 0 var(--r) var(--r); padding:10px 14px;
  display:grid; grid-template-columns:1fr 1fr; gap:8px;
}
.recovery-actions[hidden]{display:none}
.penalty-edit{display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center}
.penalty-edit select{
  min-height:44px; padding:0 10px; border:1px solid var(--line); border-radius:10px;
  background:var(--surface); color:var(--ink); font:inherit;
}
.intro{
  position:fixed; inset:0; z-index:20; display:grid; place-items:center;
  padding:24px; background:var(--ground);
}
.intro[hidden]{display:none}
.intro-card{max-width:420px; display:grid; gap:18px; text-align:center;
  background:var(--surface); border:1px solid var(--line); border-radius:20px;
  padding:28px 22px; box-shadow:var(--shadow)}
.intro-card h1,.intro-card p{margin:0}
.intro-card p{font-size:19px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">

  <div class="bar">
    <div class="fix">
      <span class="dot" id="dot"></span>
      <span class="fix-t" id="fixText">測位を開始しています…</span>
    </div>
    <div class="count"><span class="num" id="nRec">0</span>件</div>
  </div>

  <div class="storage-alert" id="storageAlert" hidden></div>
  <div class="recovery-actions" id="recoveryActions" hidden>
    <button type="button" class="ghost" id="pendingCancel" hidden>確定待ちを取り消す</button>
    <button type="button" class="ghost" id="pendingContinue" hidden>そのまま続ける</button>
    <button type="button" class="ghost danger" id="brokenStart" hidden>新しく始める</button>
  </div>

  <!-- ★ラウンドの頭で1回だけ触る所（§12 運用フロー）。
       地面の一言でサークルが 32→20yd に縮む＝**一番安い改善**（§3.2） -->
  <div class="round" id="roundbar">
    <input id="course" type="text" inputmode="text" autocomplete="off"
           placeholder="コース名を入力してください" maxlength="40">
    <div class="ground" id="ground" role="group" aria-label="今日の地面"></div>
  </div>

  <div class="setup">
    <div class="hole">
      <button type="button" id="holeDown" aria-label="ホールを戻す">−</button>
      <div class="val"><span class="num" id="holeNo">1</span><small>HOLE</small></div>
      <button type="button" id="holeUp" aria-label="次のホール">＋</button>
    </div>
    <div class="clubs" id="clubs" role="group" aria-label="番手"></div>
  </div>

  <div class="green-choice" id="nineChoice" hidden>
    <p id="ninePrompt">プレーする9ホールを選んでください。選ぶまで残り距離は表示されません。</p>
    <div class="choices" id="nineChoices" role="group" aria-label="プレーする9ホール"></div>
  </div>

  <!-- ★グリーンまで（コースのデータが有る時だけ出る） -->
  <div class="green" id="greenBox" hidden>
    <span class="gy" id="gYd">—</span><span class="gu">yd</span>
    <span class="gd" id="gDeg">—</span>
    <span class="gp" id="gPar"></span>
  </div>

  <div class="green-choice" id="greenChoice" hidden>
    <p id="greenPrompt">本日使用するグリーンを選んでください。各ホールで変更できます。</p>
    <div class="choices" role="group" aria-label="使用するグリーン">
      <button type="button" id="greenA" data-side="A">Aグリーン</button>
      <button type="button" id="greenB" data-side="B">Bグリーン</button>
      <button type="button" id="greenUnknown" data-side="">わからない</button>
    </div>
  </div>

  <main>
    <div class="stroke-counter" aria-live="polite">
      <div class="now" id="strokeCount">1打目</div>
      <div class="breakdown" id="strokeBreakdown">ここまで 0打</div>
    </div>
    <button type="button" class="hit" id="hit" data-state="tee" disabled>
      <span class="lead" id="hitLead">HOLE 1 ・ 1打目</span>
      <span class="big" id="hitBig">測位を待っています</span>
      <span class="sub" id="hitSub">空が見える場所で数秒お待ちください</span>
    </button>

    <div class="actions">
      <button type="button" class="ghost ob" id="ob" hidden>OBとして記録</button>
      <button type="button" class="ghost ob" id="lost" hidden>ロストとして記録</button>
      <button type="button" class="ghost" id="special" hidden>特設ティーへ移動</button>
    </div>
    <p class="special-hint" id="specialHint" role="status" hidden></p>

    <button type="button" class="ghost" id="holeOut" disabled>ホールアウト</button>

    <div class="penalty-edit" id="penaltyEdit" hidden>
      <label for="penaltyStrokes">直前の罰打</label>
      <select id="penaltyStrokes" aria-label="直前の罰打">
        <option value="0">0打</option><option value="1">1打</option><option value="2">2打</option>
      </select>
    </div>

    <div class="summary" id="summary" hidden></div>

    <div class="row">
      <button type="button" class="ghost" id="undo" disabled>直前の1件を取り消す</button>
      <button type="button" class="ghost" id="open">CSVを書き出す</button>
    </div>
  </main>

  <div class="last empty" id="last">まだスイングを記録していません</div>

  <div class="ask" id="ask" hidden>
    <label for="who">記録する方の氏名を入力してください</label>
    <div class="askrow">
      <input id="who" type="text" placeholder="氏名（空欄でも記録できます）" maxlength="24" autocomplete="off"
             enterkeyhint="done">
      <button type="button" class="ghost" id="whoOk">決定</button>
    </div>
  </div>
  <p class="note" id="diag" hidden></p>
</div>

<section class="sheet" id="sheet" hidden aria-label="書き出し">
  <div class="who">
    <h2>本日の記録を書き出す</h2>
    <label for="player">氏名（空欄でも書き出せます）</label>
    <input id="player" type="text" inputmode="text" autocomplete="off"
           placeholder="氏名" maxlength="24">
    <p id="sheetCount">0件</p>
  </div>
  <textarea id="csv" readonly spellcheck="false"></textarea>
  <div class="foot">
    <button type="button" class="ghost" id="copy">すべてコピー</button>
    <button type="button" class="ghost" id="close">戻る</button>
    <button type="button" class="ghost danger" id="wipe" style="grid-column:1/-1">すべて削除</button>
  </div>

  <p class="note" id="wipeNote" hidden><b>もう一度押すとすべて削除されます。</b>コピー済みかご確認ください。</p>
</section>

<section class="intro" id="intro" hidden aria-label="はじめに">
  <div class="intro-card">
    <h1>落下点ノート</h1>
    <p>打つ前に、打つ位置でボタンを押してください。</p>
    <button type="button" class="ghost" id="introOk">記録を始める</button>
  </div>
</section>

<script>
(function(){
  "use strict";
  var CLUBS=["D","3W","5W","U","4I","5I","6I","7I","8I","9I","PW","AW","SW","PT"];
  var PENALTY_LABELS={"":"なし",OB:"OB",lost:"ロスト",OB_zenshin4:"OB（前進4打）"};
  var SPECIAL_TEE_HINT="特設ティーを使用する場合は、特設ティーまで移動して「特設ティーへ移動」を押してください。";
  var deviceStorageIssue="";
  var DEV=(function(){
    var k="aigolf.dev";
    try{ var v=localStorage.getItem(k); if(v) return v; }

  }
  setInterval(function(){if(asked)paint();},2000);
  CLUBS.forEach(function(c){var b=document.createElement("button");b.type="button";b.textContent=c;b.setAttribute("aria-pressed","false");b.onclick=function(){if(!canChange())return;S.club=c;save();paint();};$("clubs").appendChild(b);});
  [["firm","硬い"],["normal","普通"],["soft","柔らかい"]].forEach(function(g){var b=document.createElement("button");b.type="button";b.textContent=g[1];b.setAttribute("data-g",g[0]);b.onclick=function(){if(!canChange())return;S.ground=S.ground===g[0]?"":g[0];save();paint();};$("ground").appendChild(b);});
  var nineButtons=[],nineChoicesKey="";
  function renderNineChoices(){
    var names=courseNines(),key=names.join("\u0001"),box=$("nineChoices");
    if(key!==nineChoicesKey){
      while(nineButtons.length)box.removeChild(nineButtons.pop());
      names.forEach(function(name){var b=document.createElement("button");b.type="button";b.textContent=name;b.onclick=function(){setNine(name);};box.appendChild(b);nineButtons.push(b);});
      nineChoicesKey=key;
    }
    nineButtons.forEach(function(b){b.setAttribute("aria-pressed",b.textContent===selectedNine()?"true":"false");});
  }
  function setNine(nine){
    if(!canChange()||courseNines().indexOf(nine)<0)return;
    remember();
    /* 最後にホールアウトした位置より後だけが進行中。過去の完了済み行は変更しない。 */
    var activeStart=0;
    for(var i=S.recs.length-1;i>=0;i--)if(S.recs[i]&&S.recs[i].holeScore!=null){activeStart=i+1;break;}
    for(var j=activeStart;j<S.recs.length;j++){
      var r=S.recs[j];
      if(r&&r.hole===S.hole&&r.holeScore==null){r.nine=nine;r.nineChoiceMade=true;}
    }
    if(S.pending&&S.pending.hole===S.hole){S.pending.nine=nine;S.pending.nineChoiceMade=true;}
    S.nine=nine;S.nineChoiceMade=true;S.summary=null;save();paint();
  }
  function setGreenSide(side){
    if(!canChange()||["","A","B"].indexOf(side)<0)return;
    remember(); S.greenSide=side; S.greenChoiceMade=true; save(); paint();
  }

  $("course").oninput=function(){if(!canChange())return;S.course=this.value.trim();save();paint();};

    if(!canChange())return;
    if(!fix){startGeo();return;}
    var near=toGreen(); if(near&&!near.bad&&near.m<=GREEN_NEAR_M&&S.club!=="PT"){S.club="PT";nudge("グリーン上のため、番手をPTに変更しました");}
    if(duplicatePendingFix()){nudge("同じ測位では続けて記録できません。数秒待ってからもう一度お試しください");return;}
    remember(); if(S.pending) finalizePending();
    var r=pointRow(); S.recs.push(r); S.pending=r; S.shot+=1; S.summary=null; save(); paint();
  };
  $("ob").onclick=function(){setPenalty("OB");}; $("lost").onclick=function(){setPenalty("lost");};
  $("special").onclick=function(){
    if(!canChange())return;
    var r=S.recs[S.recs.length-1]; if(!r||(r.penalty!=="OB"&&r.penalty!=="lost")||r.specialTee) return;
    remember();
    if(r.penalty==="OB"){var old=r.penaltyStrokes,desired=r.shot===1?2:1;r.penaltyStrokes=desired;r.penalty=desired===2?"OB_zenshin4":"OB";S.shot+=desired-old;}
    r.specialTee=true;save();paint();
  };
  $("penaltyStrokes").oninput=function(){
    if(!canChange())return;
    var r=S.recs[S.recs.length-1]; if(!r||!r.penalty) return;
    remember(); var old=Number(r.penaltyStrokes)||0,n=Math.max(0,Math.min(2,Number(this.value)||0)); r.penaltyStrokes=n;
    if(r.penalty==="OB"||r.penalty==="OB_zenshin4") r.penalty=n===2?"OB_zenshin4":"OB";

  };
  $("holeOut").onclick=function(){
    if(!canChange())return;
    if(!S.pending||!fix)return; if(duplicatePendingFix()){nudge("同じ測位では終点を確定できません。数秒待ってからもう一度お試しください");return;}
    remember(); var h=S.hole,nine=S.pending.nine||selectedNine(); finalizePending(); var rows=holeRows(h,nine),score=rows.reduce(function(n,r){return n+1+(Number(r.penaltyStrokes)||0);},0),pen=rows.reduce(function(n,r){return n+(Number(r.penaltyStrokes)||0);},0);
    rows[rows.length-1].holeScore=score; S.summary={hole:h,nine:nine,swings:rows.length,penalties:pen,score:score}; S.hole=courseHasNines()&&h>=9?1:h+1; S.shot=1; if(courseHasNines()&&h>=9){S.nine="";S.nineChoiceMade=false;} if(S.club==="PT")S.club="D"; save(); paint();
  };
  $("undo").onclick=undo;
  function lastCompletedHole(){
    for(var i=S.recs.length-1;i>=0;i--){
      var r=S.recs[i];
      if(r&&r.holeScore!=null) return {hole:r.hole,nine:r.nineChoiceMade?(r.nine||""):"",nineChoiceMade:!!r.nineChoiceMade};
    }
    return null;
  }
  function reopenHole(h,nine){
    var rows=holeRows(h,nine),last=rows[rows.length-1];
    if(!last||last.holeScore==null) return false;
    last.holeScore=null;
    last.ballLat=last.ballLon=last.ballAcc=last.ballAlt=last.ballT=last.ballStale=last.m=last.yd=last.brg=null;
    S.pending=last;
    S.shot=rows.reduce(function(n,r){return Math.max(n,r.shot+1+(Number(r.penaltyStrokes)||0));},1);
    return true;
  }
  function goHole(d){
    if(!canChange())return;
    if(S.pending){nudge("確定待ちのスイングがあります。ホールアウトまたは取り消しを選んでください");return;}
    var oldHole=S.hole,h=S.hole+d;if(courseHasNines()){if(h>9)h=1;if(h<1)h=9;}else if(h<1)return;
    var previous=d<0&&courseHasNines()?lastCompletedHole():null;
    if(previous){h=previous.hole;}
    var previousNine=previous?previous.nine:"";
    remember();S.hole=h;if(previous){S.nine=previousNine;S.nineChoiceMade=previous.nineChoiceMade;}else if(courseHasNines()&&d>0&&oldHole===9&&h===1){S.nine="";S.nineChoiceMade=false;}

    if(S.club==="PT")S.club="D";S.summary=null;save();paint();
  }

  var HEAD=["player","device","hole","shot","club","tee_lat","tee_lon","tee_acc_m","tee_alt_m","tee_time","ball_lat","ball_lon","ball_acc_m","ball_alt_m","ball_time","dist_m","dist_yd","bearing_deg","tee_stale_s","ball_stale_s","penalty","course","ground","rest_yd","to_green_deg","penalty_strokes","hole_score","green_side","nine"];
  function q(v){v=String(v==null?"":v);return /[\",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
  function csv(){var out=[HEAD.join(",")];S.recs.forEach(function(r){out.push([q(S.player),DEV,r.hole,r.shot,r.club,r.teeLat.toFixed(7),r.teeLon.toFixed(7),r.teeAcc,r.teeAlt==null?"":r.teeAlt,r.teeT,r.ballLat==null?"":r.ballLat.toFixed(7),r.ballLon==null?"":r.ballLon.toFixed(7),r.ballAcc==null?"":r.ballAcc,r.ballAlt==null?"":r.ballAlt,r.ballT==null?"":r.ballT,r.m==null?"":r.m.toFixed(1),r.yd==null?"":r.yd.toFixed(1),r.brg==null?"":r.brg.toFixed(1),r.teeStale==null?"":r.teeStale,r.ballStale==null?"":r.ballStale,r.penalty||"",q(S.course),S.ground||"",r.restYd==null?"":r.restYd.toFixed(1),r.toGreenDeg==null?"":r.toGreenDeg.toFixed(1),Number(r.penaltyStrokes)||0,r.holeScore==null?"":r.holeScore,r.greenSide||"",r.nineChoiceMade?(r.nine||""):""].join(","));});return out.join("\n");}
  var armed=false;
  $("open").onclick=function(){$("player").value=S.player;$("csv").value=csv();$("sheetCount").textContent=S.recs.length+"件（端末識別子 "+DEV+"）";armed=false;$("wipeNote").hidden=true;$("wipe").textContent="すべて削除";$("sheet").hidden=false;};
  $("player").oninput=function(){if(!canChange())return;S.player=this.value.trim();save();$("csv").value=csv();}; $("close").onclick=function(){$("sheet").hidden=true;};
  $("copy").onclick=function(){var t=$("csv");t.focus();t.select();t.setSelectionRange(0,999999);var done=function(){$("copy").textContent="コピーしました";setTimeout(function(){$("copy").textContent="すべてコピー";},1600);};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(done,function(){$("copy").textContent="長押しで選択してコピーしてください";});else try{document.execCommand("copy");done();}catch(e){$("copy").textContent="長押しで選択してコピーしてください";}};
  $("wipe").onclick=function(){if(!canChange())return;if(!armed){armed=true;$("wipeNote").hidden=false;$("wipe").textContent="削除を確定する";return;}remember();var u=S.undo;replaceState({recs:[],hole:1,shot:1,club:S.club,pending:null,player:S.player,course:S.course,ground:S.ground,summary:null,undo:u,greenSide:"",greenChoiceMade:false,nine:"",nineChoiceMade:false});save();paint();$("sheet").hidden=true;};
  $("pendingCancel").onclick=function(){
    if(saveBlocked!=="pending")return; S.pending=null; saveBlocked=""; storageIssue="";

  };

  load(); paint();
  try{$("intro").hidden=localStorage.getItem(INTRO_KEY)==="1";}catch(e){$("intro").hidden=false;storageIssue="端末の保存領域を読み込めませんでした。記録を書き出して保管してください。";paint();}
